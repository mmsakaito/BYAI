name: Firmware CI

on:
  pull_request:
    branches: [dev, main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '**/LICENSE'
      - '**/LICENSE.*'
      - '**/.gitignore'
      - '**/.clang-format'
      - '**/.clangd'
      - '**/.vscode/**'
      - 'LOGO.png'
      - 'ENV.local.example'
      - 'config.toml'
  push:
    branches: [dev, main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '**/LICENSE'
      - '**/LICENSE.*'
      - '**/.gitignore'
      - '**/.clang-format'
      - '**/.clangd'
      - '**/.vscode/**'
      - 'LOGO.png'
      - 'ENV.local.example'
      - 'config.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Test power state on host
        run: bash firmware/tests/power_state/run.sh

  firmware:
    uses: ./.github/workflows/firmware-build.yml
    with:
      refresh_cache: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') }}
