name: Firmware Build

on:
  workflow_call:
    inputs:
      refresh_cache:
        type: boolean
        required: false
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: espressif/idf:v6.1@sha256:81893c71bb5e570088901f21def8684c25cd2a9020281bd01b843a7655edb18c
    env:
      IDF_CCACHE_ENABLE: '1'
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 2G
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize container workspace
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ci-cache/ccache" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Compute cache key
        id: cache-key
        env:
          CONFIG_HASH: ${{ hashFiles('firmware/sdkconfig', 'firmware/sdkconfig.defaults', 'firmware/sdkconfig.defaults.esp32s3', 'firmware/dependencies.lock', 'firmware/partitions.csv', '.github/workflows/firmware-build.yml') }}
        run: |
          if [[ -z "$CONFIG_HASH" ]]; then
            echo "Empty CI configuration hash" >&2
            exit 1
          fi
          prefix="byai-ccache-v1-${RUNNER_OS}-idf-6.1-esp32s3-${CONFIG_HASH}"
          echo "prefix=${prefix}" >> "$GITHUB_OUTPUT"
          echo "key=${prefix}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: ${{ steps.cache-key.outputs.prefix }}-
          fail-on-cache-miss: false

      - name: Build firmware
        working-directory: firmware
        run: |
          . "$IDF_PATH/export.sh"
          "$IDF_PYTHON_ENV_PATH/bin/python" "$IDF_PATH/tools/idf.py" build
          ccache --show-stats

      - name: Check tracked build baseline
        run: git -C "$GITHUB_WORKSPACE" diff --exit-code -- firmware/sdkconfig firmware/dependencies.lock

      - name: Package firmware images
        id: package
        working-directory: firmware
        run: |
          . "$IDF_PATH/export.sh"
          source_sha="$(git rev-parse HEAD)"
          short_sha="${source_sha:0:12}"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          for file in build/BYAI.bin build/bootloader/bootloader.bin build/partition_table/partition-table.bin build/flash_args build/flasher_args.json; do
            if [[ ! -f "$file" || ! -s "$file" ]]; then
              echo "Missing CI artifact: $file" >&2
              exit 1
            fi
          done
          cp build/BYAI.bin "build/BYAI_firmware_${short_sha}.bin"
          "$IDF_PYTHON_ENV_PATH/bin/python" "$IDF_PATH/tools/idf.py" merge-bin -f raw -o "BYAI_full_flash_${short_sha}.bin"
          (
            cd build
            sha256sum "BYAI_firmware_${short_sha}.bin" "BYAI_full_flash_${short_sha}.bin" > "BYAI_SHA256SUMS_${short_sha}.txt"
            sha256sum -c "BYAI_SHA256SUMS_${short_sha}.txt"
            for file in "BYAI_firmware_${short_sha}.bin" "BYAI_full_flash_${short_sha}.bin" "BYAI_SHA256SUMS_${short_sha}.txt"; do
              if [[ ! -f "$file" || ! -s "$file" ]]; then
                echo "Missing CI artifact: build/$file" >&2
                exit 1
              fi
            done
          )

      - name: Describe test build
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## BYAI ESP32-S3 测试构建

          本构建不能替代实板验收，保留仓库现有硬件调试配置。
          - `BYAI_firmware_<sha>.bin`：应用镜像，不含 bootloader 和分区表。
          - `BYAI_full_flash_<sha>.bin`：按本次 SDK flash_args 合并的镜像，不填满整个 Flash。
          - `BYAI_SHA256SUMS_<sha>.txt`：两个镜像的 SHA-256 校验文件。

          整片合并镜像日后写入可能覆盖 NVS 所在空隙；使用前须确认设备和数据安全。
          CI 不执行烧录、擦除、Release、标签推送或 OTA。
          SUMMARY

      - name: Upload firmware images
        uses: actions/upload-artifact@v4
        with:
          name: byai-esp32s3-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            firmware/build/BYAI_firmware_${{ steps.package.outputs.short_sha }}.bin
            firmware/build/BYAI_full_flash_${{ steps.package.outputs.short_sha }}.bin
            firmware/build/BYAI_SHA256SUMS_${{ steps.package.outputs.short_sha }}.txt
          retention-days: 14
          if-no-files-found: error
          overwrite: false
          include-hidden-files: false

      - name: Save compiler cache
        if: ${{ success() && inputs.refresh_cache && github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.cache-key.outputs.key }}
