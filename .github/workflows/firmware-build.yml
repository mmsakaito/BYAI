name: Firmware Build

on:
  workflow_call:
    inputs:
      refresh_cache:
        type: boolean
        required: false
        default: false
    outputs:
      artifact_name:
        description: Name of the artifact produced by this exact workflow run.
        value: ${{ jobs.build.outputs.artifact_name }}
      source_sha:
        description: Full commit SHA used for this firmware build.
        value: ${{ jobs.build.outputs.source_sha }}
      app_version:
        description: Application version embedded in this firmware build.
        value: ${{ jobs.build.outputs.app_version }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    outputs:
      artifact_name: ${{ steps.release-meta.outputs.artifact_name }}
      source_sha: ${{ steps.release-meta.outputs.source_sha }}
      app_version: ${{ steps.release-meta.outputs.app_version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: espressif/idf:v6.1@sha256:81893c71bb5e570088901f21def8684c25cd2a9020281bd01b843a7655edb18c
    env:
      IDF_CCACHE_ENABLE: '1'
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 2G
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize container workspace
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ci-cache/ccache" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Compute cache key
        id: cache-key
        env:
          CONFIG_HASH: ${{ hashFiles('firmware/sdkconfig', 'firmware/sdkconfig.defaults', 'firmware/sdkconfig.defaults.esp32s3', 'firmware/dependencies.lock', 'firmware/partitions.csv', '.github/workflows/firmware-build.yml') }}
        run: |
          if [[ -z "$CONFIG_HASH" ]]; then
            echo "Empty CI configuration hash" >&2
            exit 1
          fi
          prefix="byai-ccache-v1-${RUNNER_OS}-idf-6.1-esp32s3-${CONFIG_HASH}"
          echo "prefix=${prefix}" >> "$GITHUB_OUTPUT"
          echo "key=${prefix}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: ${{ steps.cache-key.outputs.prefix }}-
          fail-on-cache-miss: false

      - name: Compute firmware release identity
        id: release-meta
        working-directory: firmware
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          BASE_REF: ${{ github.base_ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          . "$IDF_PATH/export.sh"
          source_sha="$(git rev-parse HEAD)"
          short_sha="${source_sha:0:12}"
          case "$EVENT_NAME:$REF_TYPE" in
            push:branch)
              source="$REF_NAME"
              case "$source" in dev|main) ;; *) echo "Unsupported release branch: $source" >&2; exit 1 ;; esac
              source_ref="$source"
              ;;
            push:tag)
              source=tag
              source_ref="$REF_NAME"
              ;;
            pull_request:*)
              source="$BASE_REF"
              case "$source" in dev|main) ;; *) echo "Unsupported PR base: $source" >&2; exit 1 ;; esac
              source_ref="$source"
              ;;
            workflow_dispatch:*)
              if [[ "$REF_NAME" == main ]]; then source=main; else source=dev; fi
              source_ref="$source"
              ;;
            *)
              echo "Unsupported build event: $EVENT_NAME ($REF_TYPE)" >&2
              exit 1
              ;;
          esac
          app_version="$(PYTHONPATH=scripts "$IDF_PYTHON_ENV_PATH/bin/python" -c 'import sys; from package_ota import application_version; print(application_version(*sys.argv[1:]))' "$source" "$source_ref" "$source_sha")"
          artifact_name="byai-esp32s3-${source_sha}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          {
            echo "source=$source"
            echo "source_ref=$source_ref"
            echo "source_sha=$source_sha"
            echo "short_sha=$short_sha"
            echo "app_version=$app_version"
            echo "artifact_name=$artifact_name"
          } >> "$GITHUB_OUTPUT"

      - name: Build firmware
        working-directory: firmware
        env:
          APP_VERSION: ${{ steps.release-meta.outputs.app_version }}
          OTA_REPOSITORY: ${{ github.repository }}
        run: |
          . "$IDF_PATH/export.sh"
          "$IDF_PYTHON_ENV_PATH/bin/python" "$IDF_PATH/tools/idf.py" -DPROJECT_VER="$APP_VERSION" -DBYAI_OTA_GITHUB_REPOSITORY="$OTA_REPOSITORY" build
          ccache --show-stats

      - name: Check tracked build baseline
        run: git -C "$GITHUB_WORKSPACE" diff --exit-code -- firmware/sdkconfig firmware/dependencies.lock

      - name: Package firmware images
        id: package
        working-directory: firmware
        env:
          SOURCE: ${{ steps.release-meta.outputs.source }}
          SOURCE_REF: ${{ steps.release-meta.outputs.source_ref }}
          SOURCE_SHA: ${{ steps.release-meta.outputs.source_sha }}
          APP_VERSION: ${{ steps.release-meta.outputs.app_version }}
        run: |
          . "$IDF_PATH/export.sh"
          source_sha="$(git rev-parse HEAD)"
          short_sha="${source_sha:0:12}"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          for file in build/BYAI.bin build/bootloader/bootloader.bin build/partition_table/partition-table.bin build/flash_args build/flasher_args.json; do
            if [[ ! -f "$file" || ! -s "$file" ]]; then
              echo "Missing CI artifact: $file" >&2
              exit 1
            fi
          done
          cp build/BYAI.bin "build/BYAI_firmware_${short_sha}.bin"
          "$IDF_PYTHON_ENV_PATH/bin/python" scripts/package_ota.py --image "build/BYAI_firmware_${short_sha}.bin" --output build/BYAI_OTA.json --source "$SOURCE" --ref "$SOURCE_REF" --commit "$SOURCE_SHA" --version "$APP_VERSION"
          "$IDF_PYTHON_ENV_PATH/bin/python" "$IDF_PATH/tools/idf.py" merge-bin -f raw -o "BYAI_full_flash_${short_sha}.bin"
          (
            cd build
            sha256sum "BYAI_firmware_${short_sha}.bin" "BYAI_full_flash_${short_sha}.bin" > "BYAI_SHA256SUMS_${short_sha}.txt"
            sha256sum -c "BYAI_SHA256SUMS_${short_sha}.txt"
            for file in "BYAI_firmware_${short_sha}.bin" "BYAI_full_flash_${short_sha}.bin" "BYAI_SHA256SUMS_${short_sha}.txt" BYAI_OTA.json; do
              if [[ ! -f "$file" || ! -s "$file" ]]; then
                echo "Missing CI artifact: build/$file" >&2
                exit 1
              fi
            done
          )

      - name: Describe test build
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## BYAI ESP32-S3 测试构建

          本构建保留仓库现有硬件调试配置；实板验收按板卡、配置和实际现象记录。
          - `BYAI_firmware_<sha>.bin`：应用镜像，不含 bootloader 和分区表。
          - `BYAI_full_flash_<sha>.bin`：按本次 SDK flash_args 合并的镜像，不填满整个 Flash。
          - `BYAI_SHA256SUMS_<sha>.txt`：两个镜像的 SHA-256 校验文件。
          - `BYAI_OTA.json`：OTA 版本、来源与应用镜像摘要。

          整片合并镜像覆盖 bootloader 至应用末尾的连续地址区间，烧录前备份该区间内的 NVS 数据。
          dev、main 与普通 tag 的成功推送会尝试发布 Release；PR 和手动运行只构建。
          SUMMARY

      - name: Upload firmware images
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release-meta.outputs.artifact_name }}
          path: |
            firmware/build/BYAI_firmware_${{ steps.package.outputs.short_sha }}.bin
            firmware/build/BYAI_full_flash_${{ steps.package.outputs.short_sha }}.bin
            firmware/build/BYAI_SHA256SUMS_${{ steps.package.outputs.short_sha }}.txt
            firmware/build/BYAI_OTA.json
          retention-days: 14
          if-no-files-found: error
          overwrite: false
          include-hidden-files: false

      - name: Save compiler cache
        if: ${{ success() && inputs.refresh_cache && github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.cache-key.outputs.key }}
